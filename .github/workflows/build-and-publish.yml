name: Build APK and publish OTA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: r2finance-ota-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Configure AWS credentials (OIDC)
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Load stable signing keystore from SSM
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          # Prefer R2Finance-specific params; fall back to Cleaning Button keystore.
          load() {
            local name="$1"
            aws ssm get-parameter --name "$name" --with-decryption \
              --query 'Parameter.Value' --output text 2>/dev/null || true
          }
          KS_B64=$(load /android/r2finance/keystore-base64)
          if [ -z "$KS_B64" ]; then
            KS_B64=$(load /android/cleaningbutton/keystore-base64)
            STORE_PASS=$(load /android/cleaningbutton/keystore-password)
            KEY_ALIAS=$(aws ssm get-parameter --name /android/cleaningbutton/key-alias --query 'Parameter.Value' --output text)
            KEY_PASS=$(load /android/cleaningbutton/key-password)
          else
            STORE_PASS=$(load /android/r2finance/keystore-password)
            KEY_ALIAS=$(aws ssm get-parameter --name /android/r2finance/key-alias --query 'Parameter.Value' --output text)
            KEY_PASS=$(load /android/r2finance/key-password)
          fi
          KS_PATH="${RUNNER_TEMP}/r2finance-upload.p12"
          printf '%s' "$KS_B64" | base64 -d > "$KS_PATH"
          test -s "$KS_PATH"
          echo "CB_KEYSTORE_PATH=$KS_PATH" >> "$GITHUB_ENV"
          echo "CB_KEYSTORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
          echo "CB_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "CB_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
          keytool -list -keystore "$KS_PATH" -storepass "$STORE_PASS" -storetype PKCS12 >/dev/null
          echo "Stable keystore loaded"

      - name: Ensure versionCode > published OTA
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          aws s3 cp "s3://cleansite/r2finance-builds/version.json" /tmp/prev-version.json \
            || echo '{}' > /tmp/prev-version.json
          export PREV_VERSION_JSON=/tmp/prev-version.json
          python3 scripts/ensure-ota-version-bump.py

      - name: Build debug APK
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            if [ -z "${CB_KEYSTORE_PATH:-}" ] || [ ! -f "${CB_KEYSTORE_PATH}" ]; then
              echo "::error::Stable keystore missing — refusing randomly signed APK"
              exit 1
            fi
          fi
          ./gradlew assembleDebug --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          test -n "$APK_PATH"
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          ls -lh "$APK_PATH"

      - name: Publish OTA to S3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: |
          set -euo pipefail
          DEST_PREFIX="s3://cleansite/r2finance-builds"
          PUBLIC_BASE="https://www.cleaningbutton.com/r2finance-builds"
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          VERSIONED="R2Finance-${STAMP}-${GITHUB_SHA:0:7}.apk"
          aws s3 cp "$APK_PATH" "$DEST_PREFIX/$VERSIONED" --content-type application/vnd.android.package-archive
          aws s3 cp "$APK_PATH" "$DEST_PREFIX/R2Finance-latest.apk" --content-type application/vnd.android.package-archive
          export LATEST_URL="$PUBLIC_BASE/R2Finance-latest.apk"
          export RELEASE_NOTES="${{ github.event.head_commit.message }}"
          export VERSION_JSON_OUT=/tmp/version.json
          export HISTORY_JSON_OUT=/tmp/history.json
          aws s3 cp "$DEST_PREFIX/history.json" /tmp/prev-history.json || echo '{"entries":[]}' > /tmp/prev-history.json
          export PREV_HISTORY_JSON=/tmp/prev-history.json
          python3 scripts/write-version-manifest.py
          aws s3 cp /tmp/version.json "$DEST_PREFIX/version.json" --content-type application/json
          aws s3 cp /tmp/history.json "$DEST_PREFIX/history.json" --content-type application/json
          echo "Published OTA: $LATEST_URL"
          cat /tmp/version.json
