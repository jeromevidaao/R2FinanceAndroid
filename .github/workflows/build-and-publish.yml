name: Build APK and publish OTA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: r2finance-ota-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Assemble + OTA publish
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write google-services.json (Firebase FCM)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            python3 -c "import json; d=json.load(open('app/google-services.json')); print('google-services ok project=', d.get('project_info',{}).get('project_id'))"
          else
            echo "WARN: GOOGLE_SERVICES_JSON secret missing — FCM disabled in this APK"
          fi

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # OIDC (secrets cannot be used in if: — continue-on-error only on PR / missing secret)
      - name: Configure AWS credentials (OIDC)
        id: aws
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Load stable signing keystore from SSM
        id: signing
        if: steps.aws.outcome == 'success'
        run: |
          set -euo pipefail
          load() {
            local name="$1"
            aws ssm get-parameter --name "$name" --with-decryption \
              --query 'Parameter.Value' --output text 2>/dev/null || true
          }
          KS_B64=$(load /android/r2finance/keystore-base64)
          if [ -z "$KS_B64" ]; then
            KS_B64=$(load /android/cleaningbutton/keystore-base64)
            STORE_PASS=$(load /android/cleaningbutton/keystore-password)
            KEY_ALIAS=$(aws ssm get-parameter --name /android/cleaningbutton/key-alias --query 'Parameter.Value' --output text)
            KEY_PASS=$(load /android/cleaningbutton/key-password)
          else
            STORE_PASS=$(load /android/r2finance/keystore-password)
            KEY_ALIAS=$(aws ssm get-parameter --name /android/r2finance/key-alias --query 'Parameter.Value' --output text)
            KEY_PASS=$(load /android/r2finance/key-password)
          fi
          test -n "$KS_B64"
          test -n "$STORE_PASS"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASS"
          KS_PATH="${RUNNER_TEMP}/r2finance-upload.p12"
          printf '%s' "$KS_B64" | base64 -d > "$KS_PATH"
          test -s "$KS_PATH"
          echo "CB_KEYSTORE_PATH=$KS_PATH" >> "$GITHUB_ENV"
          echo "CB_KEYSTORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
          echo "CB_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "CB_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
          keytool -list -keystore "$KS_PATH" -storepass "$STORE_PASS" -storetype PKCS12 -v \
            | tee /tmp/keystore-list.txt | head -40
          # Print SHA-256 so we can confirm every OTA uses the same cert
          CERT_SHA=$(keytool -list -keystore "$KS_PATH" -storepass "$STORE_PASS" -storetype PKCS12 -v 2>/dev/null \
            | awk '/SHA256:/{print $2; exit}')
          echo "Stable keystore loaded alias=$KEY_ALIAS SHA256=$CERT_SHA"
          echo "has_signing=true" >> "$GITHUB_OUTPUT"
          echo "cert_sha=$CERT_SHA" >> "$GITHUB_OUTPUT"

      - name: Ensure versionCode > published OTA
        if: steps.signing.outputs.has_signing == 'true' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          aws s3 cp "s3://cleansite/r2finance-builds/version.json" /tmp/prev-version.json \
            || echo '{}' > /tmp/prev-version.json
          export PREV_VERSION_JSON=/tmp/prev-version.json
          python3 scripts/ensure-ota-version-bump.py
          echo "Gradle versions:"
          grep -E 'versionCode|versionName' app/build.gradle.kts | head -5

      - name: Build debug APK
        run: |
          set -euo pipefail
          if [ "${{ steps.signing.outputs.has_signing }}" = "true" ]; then
            if [ -z "${CB_KEYSTORE_PATH:-}" ] || [ ! -f "${CB_KEYSTORE_PATH}" ]; then
              echo "::error::Stable keystore missing — refusing randomly signed OTA APK"
              exit 1
            fi
            echo "Building with stable upload signing"
          else
            echo "Building with default debug signing (no OTA publish)"
          fi
          ./gradlew assembleDebug --stacktrace

      - name: Locate APK + verify signature
        id: apk
        run: |
          set -euo pipefail
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          test -n "$APK_PATH"
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          ls -lh "$APK_PATH"
          cp "$APK_PATH" /tmp/R2Finance.apk
          # Stable-signed OTA: must verify so installs replace prior builds (login data kept)
          if command -v apksigner >/dev/null 2>&1; then
            apksigner verify --print-certs "$APK_PATH" | head -25
          else
            jarsigner -verify -verbose -certs "$APK_PATH" 2>&1 | head -30 || true
          fi
          echo "APK ready for OTA (same upload keystore as prior R2Finance builds)"

      - name: Upload APK artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: R2Finance-apk
          path: /tmp/R2Finance.apk
          retention-days: 7

      - name: Publish OTA to S3
        if: steps.signing.outputs.has_signing == 'true' && github.ref == 'refs/heads/main'
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
          # Multi-line safe — never expand commit message via shell interpolation
          RELEASE_NOTES: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          DEST_PREFIX="s3://cleansite/r2finance-builds"
          PUBLIC_BASE="https://www.cleaningbutton.com/r2finance-builds"
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          SHORT="${GITHUB_SHA:0:7}"
          VERSIONED="R2Finance-${STAMP}-${SHORT}.apk"
          aws s3 cp "$APK_PATH" "$DEST_PREFIX/$VERSIONED" \
            --content-type application/vnd.android.package-archive \
            --cache-control "public,max-age=31536000"
          aws s3 cp "$APK_PATH" "$DEST_PREFIX/R2Finance-latest.apk" \
            --content-type application/vnd.android.package-archive \
            --cache-control "no-cache"
          export LATEST_URL="$PUBLIC_BASE/R2Finance-latest.apk"
          export VERSION_JSON_OUT=/tmp/version.json
          export HISTORY_JSON_OUT=/tmp/history.json
          aws s3 cp "$DEST_PREFIX/history.json" /tmp/prev-history.json \
            || echo '{"entries":[]}' > /tmp/prev-history.json
          export PREV_HISTORY_JSON=/tmp/prev-history.json
          python3 scripts/write-version-manifest.py
          aws s3 cp /tmp/version.json "$DEST_PREFIX/version.json" \
            --content-type application/json --cache-control "no-cache"
          aws s3 cp /tmp/history.json "$DEST_PREFIX/history.json" \
            --content-type application/json --cache-control "no-cache"
          echo "Published OTA: $LATEST_URL"
          cat /tmp/version.json
          # Verify public URL
          sleep 2
          curl -fsSL "$PUBLIC_BASE/version.json" | tee /tmp/public-version.json
          python3 - <<'PY'
          import json, pathlib, re
          pub = json.loads(pathlib.Path("/tmp/public-version.json").read_text())
          gradle = pathlib.Path("app/build.gradle.kts").read_text()
          vc = int(re.search(r"versionCode\s*=\s*(\d+)", gradle).group(1))
          assert pub["versionCode"] == vc, (pub["versionCode"], vc)
          assert pub["apkUrl"].endswith("R2Finance-latest.apk")
          print("OTA public manifest OK", pub["versionCode"], pub["versionName"])
          PY
          # FCM topic notify (uses PREV_VERSION_JSON snapshot from ensure-ota step)
          export PREV_VERSION_JSON=/tmp/prev-version.json
          pip install --user boto3 google-auth requests -q || pip3 install --user boto3 google-auth requests -q || true
          python3 scripts/notify-app-update-fcm.py /tmp/version.json || \
            echo "::warning::FCM app_update notify failed (non-fatal)"

      - name: Fail if main OTA missing (production gate)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          if [ "${{ steps.signing.outputs.has_signing }}" != "true" ]; then
            echo "::error::OTA not published — AWS OIDC or keystore failed. Check AWS_ROLE_ARN + SSM."
            exit 1
          fi
          echo "OTA publish path completed."

      - name: OTA skipped notice (PR only)
        if: github.event_name == 'pull_request'
        run: echo "PR build — OTA publish skipped by design."
